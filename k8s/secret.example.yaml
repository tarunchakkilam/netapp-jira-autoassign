apiVersion: v1
kind: Secret
metadata:
  name: jira-autoassign-secrets
  namespace: jira-autoassign-user
type: Opaque
stringData:
  # Jira
  JIRA_BASE_URL: "https://jira.example.com"
  JIRA_EMAIL: "user@example.com"
  JIRA_API_TOKEN: "replace-me"

  # LLM
  NETAPP_LLM_API_KEY: "replace-me"
  NETAPP_LLM_BASE_URL: "https://llm-proxy-api.ai.openeng.netapp.com"

  # SMTP
  SMTP_SERVER: "smtp.example.com"
  SMTP_PORT: "25"
  SMTP_USER: "user@example.com"
  SMTP_PASSWORD: "replace-me"
  NOTIFICATION_EMAIL: "alerts@example.com"
